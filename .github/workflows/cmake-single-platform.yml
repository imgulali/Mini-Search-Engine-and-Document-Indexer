name: Build and Release (Windows CMake)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'        # triggers release on version tags like v1.0
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

    # ---- PACKAGE BUILD ----
    - name: Package Executable
      run: |
        mkdir dist
        copy build\Release\YourApp.exe dist\

    # Optional: zip it instead of raw exe
    - name: Zip Package
      run: |
        powershell Compress-Archive -Path dist\YourApp.exe -DestinationPath dist\YourApp.zip

    # ---- CREATE RELEASE (ONLY ON TAGS) ----
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/YourApp.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
